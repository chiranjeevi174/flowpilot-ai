[project]
name = "flowpilot"
version = "1.0.0"
description = "FlowPilot AI - Multi-Agent Workflow Orchestration & Business Automation Platform"
readme = "README.md"
authors = [
    { name = "chiranjeevi174", email = "chiranjeevi2034@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "celery>=5.4.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "google-genai>=2.33.0",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.37.0",
    "pwdlib[argon2]>=0.2.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "slack-sdk>=3.33.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.15.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "migrations",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["flowpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
