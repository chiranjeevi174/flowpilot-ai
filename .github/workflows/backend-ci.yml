name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-test:
    name: Backend Lint, Migrations & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot_test_password
          POSTGRES_DB: flowpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot_test_password@localhost:5432/flowpilot_test
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars-long
          LLM_ENCRYPTION_KEYS: '["k1V9O2gDqG4g3VzZ6X_K5y5uW1qR9nS8lJ4fA0bC2eY="]'
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot_test_password@localhost:5432/flowpilot_test
          TEST_DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot_test_password@localhost:5432/flowpilot_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars-long
          LLM_ENCRYPTION_KEYS: '["k1V9O2gDqG4g3VzZ6X_K5y5uW1qR9nS8lJ4fA0bC2eY="]'
        run: uv run pytest -v
